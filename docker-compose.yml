version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: nadafpinjar_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nadaf_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nadaf_password}
      POSTGRES_DB: ${POSTGRES_DB:-nadaf_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongodb:
    image: mongo:6.0
    container_name: nadafpinjar_mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-adminpassword}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-nadaf_census}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: nadafpinjar_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  mongo_data:
  redis_data:
