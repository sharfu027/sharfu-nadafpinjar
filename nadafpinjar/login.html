
<!DOCTYPE html>
<!--
BeyondAdmin - Responsive Admin Dashboard Template build with Twitter Bootstrap 3.3.6
Version: 1.6.0
-->

<html xmlns="http://www.w3.org/1999/xhtml">
<!--Head-->
<head>
    <meta charset="utf-8" />
    <title>Admin Login - Karnataka State Nadaf / Pinjar Sangha</title>

    <meta name="description" content="Admin Login" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <link rel="shortcut icon" href="images/favicon.png" type="image/x-icon" />

    <!--Basic Styles-->
    <link href="css/bootstrap.min.css" rel="stylesheet" />
    <link href="css/font-awesome.css" rel="stylesheet" />

    <!--Beyond styles-->
    <link href="css/beyond.css" rel="stylesheet" />
    <link href="css/demo.css" rel="stylesheet" />
    <link href="css/animate.css" rel="stylesheet" />

    <script src="js/skins.min.js"></script>
    <style>
        .loading-overlay {
            display: none;
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(79, 25, 113, 0.85);
            z-index: 9999;
            justify-content: center; align-items: center;
            flex-direction: column; color: #fff; font-family: sans-serif;
        }
        .loading-overlay.show { display: flex; }
        .spinner {
            width: 50px; height: 50px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .error-msg {
            display: none;
            background: #ff4444; color: #fff;
            padding: 10px 15px; border-radius: 4px;
            margin: 10px 0; font-size: 14px; text-align: center;
        }
        .error-msg.show { display: block; }
    </style>
</head>
<!--Head Ends-->

<body style="background-color:#4f1971 !important;">

    <!-- Loading overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
        <p style="font-size: 18px;">Logging in, please wait...</p>
    </div>

    <div class="login-container animated fadeInDown">
        <div class="loginbox bg-white" style="width: 120% !important;">
            <img src="images/loginbanner.jpg" alt="" />
            <div class="widget-header bg-purple">
                <span class="widget-caption text-align-center" style="font-size: x-large;">Admin Login</span>
                <div class="widget-buttons"></div>
            </div>
            <div class="loginbox-textbox">
                <div id="errorMsg" class="error-msg"></div>
                <form id="loginForm" method="post">
                    <div class="radio">
                        <label>
                            <span class="text">User Name </span>
                        </label>
                        <div class="loginbox-textbox">
                            <input name="txtCustomerId" type="text" id="txtCustomerId" class="form-control" required />
                        </div>
                    </div>
                    <div class="radio">
                        <label>
                            <span class="text">Password </span>
                        </label>
                        <div class="loginbox-textbox">
                            <input name="txtpassword" type="password" id="txtpassword" class="form-control" required />
                        </div>
                    </div>
                    <div class="loginbox-submit text-align-right">
                        <input type="submit" name="btnLogin" value="Login" id="btnLogin" class="btn btn-purple shiny" />
                    </div>
                </form>
            </div>
            <div class="loginbox-signup">
                <a>For Sign Up, Please Download the App</a>
            </div>
        </div>
    </div>

    <script src="js/jquery.min.js"></script>
    <script src="js/bootstrap.min.js"></script>
    <script src="js/jquery.slimscroll.min.js"></script>
    <script src="js/beyond.js"></script>

    <script>
    (function() {
        var form = document.getElementById('loginForm');
        var errorMsg = document.getElementById('errorMsg');
        var loading = document.getElementById('loadingOverlay');

        // Check if user is already logged in to bypass login page
        fetch('/admin/accountsummary', { credentials: 'include' })
        .then(function(r) { return r.text(); })
        .then(function(html) {
            if (html.indexOf('txtCustomerId') === -1 && (html.indexOf('Account Summary') > -1 || html.indexOf('Logout') > -1 || html.indexOf('Dashboard') > -1)) {
                window.location.href = '/admin/accountsummary';
            }
        })
        .catch(function(e) {
            console.log('Session check error:', e);
        });




        form.addEventListener('submit', function(e) {
            e.preventDefault();
            errorMsg.className = 'error-msg';
            loading.className = 'loading-overlay show';

            var username = document.getElementById('txtCustomerId').value;
            var password = document.getElementById('txtpassword').value;

            if (!username || !password) {
                loading.className = 'loading-overlay';
                errorMsg.textContent = 'Please enter both username and password.';
                errorMsg.className = 'error-msg show';
                return;
            }

            // Step 1: Fetch the login page from the admin proxy to get __VIEWSTATE
            fetch('/admin/accountsummary', { credentials: 'include' })
            .then(function(r) { return r.text(); })
            .then(function(html) {
                // Extract __VIEWSTATE and __VIEWSTATEGENERATOR
                var parser = new DOMParser();
                var doc = parser.parseFromString(html, 'text/html');
                var viewState = '';
                var viewStateGen = '';
                var vsEl = doc.getElementById('__VIEWSTATE');
                var vsgEl = doc.getElementById('__VIEWSTATEGENERATOR');
                if (vsEl) viewState = vsEl.value;
                if (vsgEl) viewStateGen = vsgEl.value;

                // Step 2: POST login credentials
                var formData = new URLSearchParams();
                formData.append('__VIEWSTATE', viewState);
                formData.append('__VIEWSTATEGENERATOR', viewStateGen);
                formData.append('txtCustomerId', username);
                formData.append('txtpassword', password);
                formData.append('btnLogin', 'Login');

                return fetch('/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: formData.toString(),
                    credentials: 'include',
                    redirect: 'follow'
                });
            })
            .then(function(r) {
                // Check if login was successful
                // After successful login, the response will be the dashboard page
                // After failed login, it will be the login page again
                return r.text().then(function(html) {
                    return { html: html, url: r.url, ok: r.ok };
                });
            })
            .then(function(result) {
                loading.className = 'loading-overlay';

                // Check if we're still on the login page (login failed)
                if (result.html.indexOf('txtCustomerId') > -1 && result.html.indexOf('txtpassword') > -1 && result.html.indexOf('Account Summary') === -1) {
                    errorMsg.textContent = 'Invalid username or password. Please try again.';
                    errorMsg.className = 'error-msg show';
                    return;
                }

                // Login successful! Redirect to admin dashboard
                window.location.href = '/admin/accountsummary';
            })
            .catch(function(err) {
                loading.className = 'loading-overlay';
                console.error('Login error:', err);
                errorMsg.textContent = 'Unable to connect to admin server. Please try again.';
                errorMsg.className = 'error-msg show';
            });
        });
    })();
    </script>
</body>
</html>
