<html xmlns="http://www.w3.org/1999/xhtml">
<!--Head-->
<head>
    <meta charset="utf-8" />
    <title>Login Page</title>

    <meta name="description" content="login page" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <link rel="shortcut icon" href="images/favicon.png" type="image/x-icon" />

    <!--Basic Styles-->
    <link href="css/bootstrap.min.css" rel="stylesheet" />
    <link href="css/font-awesome.css" rel="stylesheet" />

    <!--Beyond styles-->
    <link href="css/beyond.css" rel="stylesheet" />
    <link href="css/demo.css" rel="stylesheet" />
    <link href="css/animate.css" rel="stylesheet" />

    <!--Skin Script: Place this script in head to load scripts for skins and rtl support-->
    <script src="js/skins.min.js"></script>
</head>
<!--Head Ends-->

<body style="background-color:#4f1971 !important;">
    <form method="post" action="https://nadafpinjar.com/login" id="ctl01" class="bg-purple">
        <!-- loader -->

        <div class="login-container animated fadeInDown">
            <div class="loginbox bg-white" style="width: 120% !important;">
                <img src="images/loginbanner.jpg" alt="" />
                <div class="widget-header bg-purple">
                    <span class="widget-caption  text-align-center" style="font-size: x-large;">Admin Login
                    </span>
                    <div class="widget-buttons">
                    </div>
                    <!--Widget Buttons-->
                </div>
                <div class="loginbox-textbox">
                    <div class="radio">
                        <label>
                            <span class="text">User Name </span>
                        </label>
                        <div class="loginbox-textbox">
                            <input name="txtCustomerId" type="text" id="txtCustomerId" class="form-control" />
                        </div>
                    </div>
                    <div class="radio">
                        <label>
                            <span class="text">Password </span>
                        </label>
                        <div class="loginbox-textbox">
                            <input name="txtpassword" type="password" id="txtpassword" class="form-control" />
                        </div>
                    </div>
                    <div class="loginbox-submit text-align-right">
                        <input type="submit" name="btnLogin" value="Login" id="btnLogin" class="btn btn-purple shiny " />
                    </div>
                </div>

                <div class="loginbox-signup">
                    <a>For Sign Up, Please Download the App</a>
                </div>
            </div>

        </div>

        <!--Basic Scripts-->
        <script src="js/jquery.min.js"></script>
        <script src="js/bootstrap.min.js"></script>
        <script src="js/jquery.slimscroll.min.js"></script>

        <!--Beyond Scripts-->
        <script src="js/beyond.js"></script>

    </form>
</body>

</html>
