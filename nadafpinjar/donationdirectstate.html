    <script>
        const RAZORPAY_KEY = "rzp_live_SISoxIvhIen2o1";
        let formData = {};

        const directForm = document.getElementById('directStateForm');
        if (directForm) {
            directForm.addEventListener('submit', function(e) {
                e.preventDefault();
                const formObj = new FormData(this);
                formData = Object.fromEntries(formObj.entries());
                showPreview();
            });
        }

        
        function showPreview() {
            document.getElementById('formContainer').style.display = 'none';
            if(!document.getElementById('previewContainer')) return submitToMongoDB();
            document.getElementById('previewContainer').style.display = 'block';

            // Custom targeted labels mapping
            const labelMap = {
                'donorName': 'ಪೂರ್ಣ ಹೆಸರು',
                'address': 'ಪೂರ್ಣ ವಿಳಾಸ',
                'village': 'ಗ್ರಾಮ / ನಗರ',
                'mobile': 'ಮೊಬೈಲ್',
                'district': 'ಜಿಲ್ಲೆ',
                'taluk': 'ತಾಲೂಕು',
                'account': 'ಉದ್ದೇಶ',
                'purposeDetails': 'ಉದ್ದೇಶದ ವಿವರಗಳು',
                'paymentMode': 'ಪಾವತಿ ವಿಧಾನ'
            };

            // Custom grid span classes
            const spanMap = {
                'donorName': 'span-6',
                'address': 'span-6',
                'village': 'span-4',
                'district': 'span-4',
                'mobile': 'span-4',
                'taluk': 'span-4',
                'account': 'span-6',
                'purposeDetails': 'span-6',
                'paymentMode': 'span-12'
            };

            const fieldsOrder = ['donorName', 'address', 'village', 'district', 'mobile', 'taluk', 'account', 'purposeDetails', 'paymentMode'];
            let previewHTML = '';
            fieldsOrder.forEach(key => {
                if (formData[key] !== undefined) {
                    let label = labelMap[key] || key;
                    let spanClass = spanMap[key] || 'span-6';
                    let val = formData[key] || '-';

                    previewHTML += `
                        <div class="preview-card ${spanClass}">
                            <span class="preview-card-label">${label}</span>
                            <p class="preview-card-value">${val}</p>
                        </div>
                    `;
                }
            });

            document.getElementById('previewContent').innerHTML = previewHTML;
            if(document.getElementById('displayAmount')) {
                document.getElementById('displayAmount').textContent = formData.amount || 0;
            }

            window.scrollTo(0, 0);
        }

        function editForm() {
            document.getElementById('formContainer').style.display = 'block';
            document.getElementById('previewContainer').style.display = 'none';
            window.scrollTo(0, 0);
        }

        function initiatePayment() {
            if (formData.paymentMode === 'Cash/Offline') {
                submitToMongoDB(null);
                return;
            }

            const amount = parseInt(formData.amount || 0) * 100;
            
            if (!amount) {
                submitToMongoDB();
                return;
            }

            const options = {
                key: RAZORPAY_KEY,
                amount: amount,
                currency: "INR",
                name: "Karnataka State Nadaf / Pinjar Sangha",
                description: "ರಾಜ್ಯಕ್ಕೆ ನೇರ ಮೊತ್ತ ವರ್ಗಾವಣೆ",
                image: "images/header-nadaf.png",
                handler: function (response) {
                    submitToMongoDB(response.razorpay_payment_id);
                },
                prefill: {
                    name: formData.donorName || formData.presidentName || formData.studentName || '',
                    contact: formData.mobile || formData.presidentMobile || ''
                },
                notes: Object.assign({}, formData),
                theme: {
                    color: "#0066cc"
                },
                modal: {
                    ondismiss: function() {
                        alert('Payment cancelled. You can try again.');
                    }
                }
            };

            const rzp = new Razorpay(options);
            
            rzp.on('payment.failed', function (response) {
                alert('Payment Failed!\n\nError: ' + response.error.description);
            });

            rzp.open();
        }

        function submitToMongoDB(paymentId = null) {
            // Save to localStorage receipts database for Admin Dashboard compatibility
            try {
                const receipts = JSON.parse(localStorage.getItem('receipts')) || [];
                const tempId = `GENERATE-${Date.now()}`;
                
                const newReceipt = {
                    id: tempId,
                    date: new Date().toISOString().split('T')[0],
                    amount: parseFloat(formData.amount || 0),
                    from: "Amount Transfer Direct to State",
                    status: "",
                    mode: formData.paymentMode || "Cash",
                    narration: `Donated Amount Received in Account Number KRATNATAKA STATE PINJAR SANGHA FROM :${formData.donorName || 'Donor'}`,
                    details: {
                        transactionDate: new Date().toISOString().replace('T', ' ').substring(0, 19),
                        fullName: formData.donorName || "",
                        address: formData.address || "",
                        mobile: formData.mobile || "",
                        village: formData.village || "",
                        district: formData.district || "",
                        taluk: formData.taluk || "",
                        purpose: formData.account || "",
                        purposeDetails: formData.purposeDetails || "",
                        amount: String(formData.amount || 0),
                        mode: formData.paymentMode || "Cash"
                    }
                };
                receipts.unshift(newReceipt);
                localStorage.setItem('receipts', JSON.stringify(receipts));
            } catch (e) {
                console.error("Failed to save receipt to localStorage:", e);
            }

            const dataToSave = {
                formType: "ರಾಜ್ಯಕ್ಕೆ ನೇರ ಮೊತ್ತ ವರ್ಗಾವಣೆ",
                amount: parseInt(formData.amount || 0),
                paymentId: paymentId,
                formData: formData
            };

            fetch('https://nadafpinjar-production.up.railway.app/api/donations', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dataToSave)
            })
            .then(res => res.json())
            .then(data => {
                showReceipt(formData, paymentId);
            })
            .catch(err => {
                console.error(err);
                showReceipt(formData, paymentId);
            });
        }

        function showReceipt(data, paymentId) {
            document.getElementById('formContainer').style.display = 'none';
            document.getElementById('previewContainer').style.display = 'none';
            
            const receiptContainer = document.getElementById('receiptContainer');
            if (receiptContainer) receiptContainer.style.display = 'none';

            printReceipt(data, paymentId);
        }

            const formattedDate = formatDateDashes(new Date());

            // Create invisible iframe off-screen
            let iframe = document.getElementById('receiptPrintIframe');
            if (!iframe) {
                iframe = document.createElement('iframe');
                iframe.id = 'receiptPrintIframe';
                iframe.style.position = 'fixed';
                iframe.style.left = '-9999px';
                iframe.style.top = '-9999px';
                iframe.style.width = '0';
                iframe.style.height = '0';
                iframe.style.border = '0';
                document.body.appendChild(iframe);
            }
            
            iframe.style.width = '210mm';
            iframe.style.height = '800px';
            const doc = iframe.contentWindow.document;
            doc.open();
            doc.write(printHTML);
            doc.close();
            
            setTimeout(() => {
                iframe.style.width = '794px';
                iframe.style.height = '100px';
                
                setTimeout(() => {
                    const container = doc.querySelector('.receipt-container');
                    const isMobile = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
                    if (container) {
                        container.style.margin = isMobile ? '0' : '0 auto';
                    }
                    const rect = container ? container.getBoundingClientRect() : { width: 750, height: 450 };
                    const contentH = Math.ceil(rect.height || (container ? container.offsetHeight : 450));
                    const contentW = Math.ceil(rect.width || (container ? container.offsetWidth : 750));
                    const pageHmm = Math.ceil(contentH * 0.264583) + 1;
                    let pageWmm = Math.ceil(contentW * 0.264583) + 1;
                    if (pageWmm < 210) pageWmm = 210;

                    if (isMobile) {
                        const script = doc.createElement('script');
                        script.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js';
                        script.onload = () => {
                            const win = iframe.contentWindow;
                            const h2c = win.html2canvas || window.html2canvas;
                            const jsPdfClass = win.jsPDF || (win.jspdf && win.jspdf.jsPDF) || window.jsPDF || (window.jspdf && window.jspdf.jsPDF);

                            const pdfWmm = contentW * 0.264583;
                            const pdfHmm = contentH * 0.264583;
                            const isLandscape = pdfWmm >= pdfHmm;

                            if (h2c && jsPdfClass) {
                                h2c(container, {
                                    scale: 2,
                                    useCORS: true,
                                    letterRendering: false,
                                    scrollX: 0,
                                    scrollY: 0,
                                    width: contentW,
                                    height: contentH,
                                    windowWidth: contentW,
                                    windowHeight: contentH
                                }).then(canvas => {
                                    const imgData = canvas.toDataURL('image/jpeg', 0.98);
                                    const pdf = new jsPdfClass({
                                        orientation: isLandscape ? 'landscape' : 'portrait',
                                        unit: 'mm',
                                        format: [Math.min(pdfWmm, pdfHmm), Math.max(pdfWmm, pdfHmm)]
                                    });
                                    pdf.addImage(imgData, 'JPEG', 0, 0, pdfWmm, pdfHmm);
                                    pdf.save('Receipt-' + (paymentId || 'Offline') + '.pdf');
                                });
                            } else {
                                const opt = {
                                    margin: 0,
                                    filename: 'Receipt-' + (paymentId || 'Offline') + '.pdf',
                                    image: { type: 'jpeg', quality: 0.98 },
                                    html2canvas: { scale: 2, useCORS: true, letterRendering: false, scrollX: 0, scrollY: 0, width: contentW, height: contentH, windowWidth: contentW, windowHeight: contentH },
                                    jsPDF: { unit: 'mm', format: [Math.min(pdfWmm, pdfHmm), Math.max(pdfWmm, pdfHmm)], orientation: isLandscape ? 'landscape' : 'portrait' }
                                };
                                win.html2pdf().from(container).set(opt).save();
                            }
                        };
                        doc.head.appendChild(script);
                    } else {
                        const dynStyle = doc.createElement('style');
                        dynStyle.textContent = `@media print {
            @page {
                size: A5 landscape;
                margin: 0;
            }
            html, body {
                width: 210mm;
                height: 148mm;
                margin: 0;
                padding: 0;
                overflow: hidden !important;
            }
            body {
                padding: 0;
            }
            .receipt-container {
                width: 198mm !important;
                max-height: 140mm !important;
                margin: 2mm auto !important;
                padding: 3px 5px !important;
                border: none !important;
                box-sizing: border-box !important;
                page-break-inside: avoid !important;
                break-inside: avoid !important;
                page-break-after: avoid !important;
                break-after: avoid !important;
                background: #fff !important;
            }
        }`;
                        doc.head.appendChild(dynStyle);

                        iframe.style.width = '0';
                        iframe.style.height = '0';
                        iframe.contentWindow.focus();
                        iframe.contentWindow.print();
                    }
                }, 200);
            }, 300);
        }

        // Toggle Cash/Offline fields dynamically
        const paymentModeSelect = document.getElementById('paymentMode');
        const bankDetailsGroup = document.getElementById('bankDetailsGroup');
        const offlineReceiptRow = document.getElementById('offlineReceiptRow');

        function toggleOfflineFields() {
            if (paymentModeSelect.value === 'Cash/Offline') {
                bankDetailsGroup.style.display = 'block';
                offlineReceiptRow.style.display = 'flex';
                document.getElementById('bankDetails').required = true;
                document.getElementById('depositDate').required = true;
            } else {
                bankDetailsGroup.style.display = 'none';
                offlineReceiptRow.style.display = 'none';
                document.getElementById('bankDetails').required = false;
                document.getElementById('depositDate').required = false;
            }
        }

        if (paymentModeSelect) {
            paymentModeSelect.addEventListener('change', toggleOfflineFields);
            // Run initially to ensure correct visibility state on load
            toggleOfflineFields();
        }
    </script>
