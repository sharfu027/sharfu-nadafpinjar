    <script>
        const RAZORPAY_KEY = "rzp_live_SISoxIvhIen2o1";
        let formData = {};

        const directForm = document.getElementById('directStateForm');
        if (directForm) {
            directForm.addEventListener('submit', function(e) {
                e.preventDefault();
                const formObj = new FormData(this);
                formData = Object.fromEntries(formObj.entries());
                showPreview();
            });
        }

        
        function handleFormPreview(e) {
            if (e) e.preventDefault();
            const form = document.getElementById('directStateForm');
            if (form) {
                if (!form.checkValidity()) {
                    form.reportValidity();
                    return;
                }
                const formObj = new FormData(form);
                formData = Object.assign(formData || {}, Object.fromEntries(formObj.entries()));
            }
            const pmSelect = document.getElementById('paymentMode');
            if (pmSelect) {
                formData.paymentMode = pmSelect.value;
            }
            showPreview();
        }

        function showPreview() {
            document.getElementById('formContainer').style.display = 'none';
            if(!document.getElementById('previewContainer')) return submitToMongoDB();
            document.getElementById('previewContainer').style.display = 'block';

            // Custom targeted labels mapping
            const labelMap = {
                'donorName': 'ಪೂರ್ಣ ಹೆಸರು',
                'address': 'ಪೂರ್ಣ ವಿಳಾಸ',
                'village': 'ಗ್ರಾಮ / ನಗರ',
                'mobile': 'ಮೊಬೈಲ್',
                'district': 'ಜಿಲ್ಲೆ',
                'taluk': 'ತಾಲೂಕು',
                'account': 'ಉದ್ದೇಶ',
                'purposeDetails': 'ಉದ್ದೇಶದ ವಿವರಗಳು',
                'paymentMode': 'ಪಾವತಿ ವಿಧಾನ'
            };

            // Custom grid span classes
            const spanMap = {
                'donorName': 'span-6',
                'address': 'span-6',
                'village': 'span-4',
                'district': 'span-4',
                'mobile': 'span-4',
                'taluk': 'span-4',
                'account': 'span-6',
                'purposeDetails': 'span-6',
                'paymentMode': 'span-12'
            };

            const fieldsOrder = ['donorName', 'address', 'village', 'district', 'mobile', 'taluk', 'amount', 'account', 'purposeDetails', 'paymentMode', 'bankDetails', 'depositDate'];
            let previewHTML = '';
            fieldsOrder.forEach(key => {
                if (formData[key] !== undefined) {
                    let label = labelMap[key] || key;
                    let spanClass = spanMap[key] || 'span-6';
                    let val = formData[key] || '-';

                    previewHTML += `
                        <div class="preview-card ${spanClass}">
                            <span class="preview-card-label">${label}</span>
                            <p class="preview-card-value">${val}</p>
                        </div>
                    `;
                }
            });

            document.getElementById('previewContent').innerHTML = previewHTML;
            if(document.getElementById('displayAmount')) {
                document.getElementById('displayAmount').textContent = formData.amount || 0;
            }

            const isOffline = (formData.paymentMode === 'Cash/Offline' || formData.paymentMode === 'Offline');
            if (document.getElementById('btnPay')) document.getElementById('btnPay').style.display = isOffline ? 'none' : 'inline-block';
            if (document.getElementById('btnSubmitOffline')) document.getElementById('btnSubmitOffline').style.display = isOffline ? 'inline-block' : 'none';

            window.scrollTo(0, 0);
        }

        function editForm() {
            document.getElementById('formContainer').style.display = 'block';
            document.getElementById('previewContainer').style.display = 'none';
            window.scrollTo(0, 0);
        }

        function initiatePayment() {
            if (formData.paymentMode === 'Cash/Offline' || formData.paymentMode === 'Offline') {
                submitToMongoDB(null);
                return;
            }

            const amount = Math.round(parseFloat(formData.amount || 0) * 100);
            if (!amount) {
                submitToMongoDB(null);
                return;
            }

            if (typeof Razorpay === 'undefined') {
                console.warn('Razorpay SDK loading dynamically...');
                const script = document.createElement('script');
                script.src = 'https://checkout.razorpay.com/v1/checkout.js';
                script.onload = () => openRazorpayModal(amount);
                script.onerror = () => {
                    alert('Online payment gateway unavailable. Proceeding with form submission.');
                    submitToMongoDB('OFFLINE-PAYMENT');
                };
                document.head.appendChild(script);
            } else {
                openRazorpayModal(amount);
            }
        }

        function openRazorpayModal(amount) {
            try {
                const options = {
                    key: RAZORPAY_KEY,
                    amount: amount,
                    currency: "INR",
                    name: "Karnataka State Nadaf / Pinjar Sangha",
                    description: "ರಾಜ್ಯಕ್ಕೆ ನೇರ ಮೊತ್ತ ವರ್ಗಾವಣೆ",
                    image: "images/header-nadaf.png",
                    handler: function (response) {
                        submitToMongoDB(response.razorpay_payment_id || ('PAY-' + Date.now()));
                    },
                    prefill: {
                        name: formData.donorName || formData.presidentName || '',
                        contact: formData.mobile || formData.presidentMobile || formData.donorMobile || ''
                    },
                    notes: Object.assign({}, formData),
                    theme: { color: "#0066cc" },
                    modal: {
                        ondismiss: function() {
                            console.log('Payment modal closed by user');
                        }
                    }
                };
                const rzp = new Razorpay(options);
                rzp.on('payment.failed', function (response) {
                    alert('Payment Failed! ' + (response.error ? response.error.description : ''));
                });
                rzp.open();
            } catch(err) {
                console.error('Razorpay initialization error:', err);
                alert('Payment gateway initialization issue. Proceeding with receipt generation.');
                submitToMongoDB('RZP-PAYMENT-' + Date.now());
            }
        }

        function submitToMongoDB(paymentId = null) {
            // Save to localStorage receipts database for Admin Dashboard compatibility
            try {
                const receipts = JSON.parse(localStorage.getItem('receipts')) || [];
                const tempId = `GENERATE-${Date.now()}`;
                
                const newReceipt = {
                    id: tempId,
                    date: new Date().toISOString().split('T')[0],
                    amount: parseFloat(formData.amount || 0),
                    from: "Amount Transfer Direct to State",
                    status: "",
                    mode: formData.paymentMode || "Cash",
                    narration: `Donated Amount Received in Account Number KRATNATAKA STATE PINJAR SANGHA FROM :${formData.donorName || 'Donor'}`,
                    details: {
                        transactionDate: new Date().toISOString().replace('T', ' ').substring(0, 19),
                        fullName: formData.donorName || "",
                        address: formData.address || "",
                        mobile: formData.mobile || "",
                        village: formData.village || "",
                        district: formData.district || "",
                        taluk: formData.taluk || "",
                        purpose: formData.account || "",
                        purposeDetails: formData.purposeDetails || "",
                        amount: String(formData.amount || 0),
                        mode: formData.paymentMode || "Cash"
                    }
                };
                receipts.unshift(newReceipt);
                localStorage.setItem('receipts', JSON.stringify(receipts));
            } catch (e) {
                console.error("Failed to save receipt to localStorage:", e);
            }

            const dataToSave = {
                formType: "ರಾಜ್ಯಕ್ಕೆ ನೇರ ಮೊತ್ತ ವರ್ಗಾವಣೆ",
                amount: parseInt(formData.amount || 0),
                paymentId: paymentId,
                formData: formData
            };

            let apiPromise = fetch('/api/donations', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dataToSave)
            })
            .then(res => {
                if (!res.ok) throw new Error("Local save failed");
                return res.json();
            })
            .catch(() => {
                return fetch('/api/donations', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dataToSave)
                }).then(res => res.json());
            });

            apiPromise
            .then(data => {
                showReceipt(formData, paymentId);
            })
            .catch(err => {
                console.error(err);
                showReceipt(formData, paymentId);
            });
        }

        
        let currentGeneratedReceiptId = "";
        let currentReceiptData = null;

        function showReceipt(data, paymentId) {
            currentReceiptData = data;
            const seqNo = Math.floor(1000 + Math.random() * 9000);
            currentGeneratedReceiptId = paymentId || ('KRNPS-2026-S-' + seqNo);
            
            document.getElementById('formContainer').style.display = 'none';
            document.getElementById('previewContainer').style.display = 'none';
            
            const receiptContainer = document.getElementById('receiptContainer');
            if (receiptContainer) receiptContainer.style.display = 'block';

            if (document.getElementById('modalReceiptId')) {
                document.getElementById('modalReceiptId').textContent = currentGeneratedReceiptId;
            }
            if (document.getElementById('successModal')) {
                document.getElementById('successModal').style.display = 'flex';
            }

            printReceipt(data, currentGeneratedReceiptId);
        }

        function downloadReceiptPDF() {
            if (currentReceiptData) {
                printReceipt(currentReceiptData, currentGeneratedReceiptId);
            }
        }

        function closeSuccessModal() {
            if (document.getElementById('successModal')) {
                document.getElementById('successModal').style.display = 'none';
            }
        }
    

        function printReceipt(data, paymentId) {
            const formatDateDashes = (dateStr) => {
                if (!dateStr) return "";
                const d = new Date(dateStr);
                if (isNaN(d.getTime())) return dateStr;
                const day = String(d.getDate()).padStart(2, '0');
                const month = String(d.getMonth() + 1).padStart(2, '0');
                const year = d.getFullYear();
                return `${day}-${month}-${year}`;
            };

            const formatCurrencyRaw = (amount) => {
                return Number(amount || 0).toLocaleString('en-IN', {
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 2
                });
            };

            const formattedDate = formatDateDashes(new Date());
            const recId = paymentId || ('KRNPS-2026-S-' + Math.floor(1000 + Math.random() * 9000));

            const donorName = data.donorName || data.fullName || data.presidentName || "-";
            const village = data.village || data.donorVillage || data.presidentVillage || "-";
            const address = data.address || data.donorAddress || data.presidentAddress || "-";
            const mobile = data.mobile || data.donorMobile || data.presidentMobile || "-";
            const taluk = data.taluk || data.donorTaluk || data.presidentTaluk || "-";
            const district = data.district || data.donorDistrict || data.presidentDistrict || "-";
            const amountVal = formatCurrencyRaw(data.amount);
            const modeVal = data.paymentMode || "Online";
            const accountVal = data.account || "ವಾರ್ಷಿಕ ವಂತಿಗೆ";
            const purposeVal = data.purposeDetails || "ಶೈಕ್ಷಣಿಕ ಪ್ರೋತ್ಸಾಹಕ್ಕಾಗಿ";

            const container = document.createElement('div');
            container.style.cssText = "width: 794px; padding: 10px; background: #fff; font-family: 'Noto Sans Kannada', 'Open Sans', sans-serif; box-sizing: border-box; color: #000;";

            container.innerHTML = `
                <div style="border: 2px solid #800000; padding: 4px; background: #fff;">
                    <!-- Header Box -->
                    <div style="border: 2px solid #800000; background-color: #ffedc2; padding: 8px; text-align: center; position: relative; border-radius: 4px;">
                        <img src="images/president.jpeg" onerror="this.src='images/president.png'" style="position: absolute; left: 12px; top: 12px; width: 90px; height: 90px; border-radius: 50%; border: 2px solid #800000; object-fit: cover;">
                        
                        <div style="font-size: 26px; font-weight: bold; color: #990000; margin-bottom: 2px;">ಕರ್ನಾಟಕ ರಾಜ್ಯ ನಡಾಫ್/ಪಿಂಜಾರ್ ಸಂಘ (ರಿ)</div>
                        <div style="font-size: 13.5px; font-weight: bold; color: #990000; margin-bottom: 2px;">ನೋ. ಸಂ. : 151/ಎಸ್ ಒ ಆರ್/ಎಸ್ ಎಂ ಜಿ/1993-94</div>
                        <div style="font-size: 15px; font-weight: bold; color: #990000; letter-spacing: 0.5px; margin-bottom: 2px;">KARNATAKA RAJYA NADAF/PINJAR SANGHA ®</div>
                        <div style="font-size: 12.5px; font-weight: bold; color: #990000;">ಆಡಳಿತ ಕಚೇರಿ : ವಿಶ್ವಮಾನವ ಸಾಂಸ್ಕೃತಿಕ ಮತ್ತು ವಿದ್ಯಾ ಸಂಸ್ಥೆ ಆವರಣ</div>
                        <div style="font-size: 12.5px; font-weight: bold; color: #990000;">ಸಿಬಾರ-ಗುತ್ತಿನಾಡು, ಚಿತ್ರದುರ್ಗ-577502</div>
                        
                        <img src="images/logo-786.png" style="position: absolute; right: 12px; top: 12px; width: 90px; height: 90px; border-radius: 50%; border: 2px solid #800000; object-fit: cover;">
                    </div>

                    <!-- Receipt Header Bar -->
                    <table style="width: 100%; border-collapse: collapse; margin-top: 4px; border-bottom: 1.5px solid #800000; font-size: 13px; font-weight: bold;">
                        <tr>
                            <td style="width: 33%; padding: 4px;">ರಶೀದಿ ಸಂಖ್ಯೆ: <span style="font-weight: bold;">${recId}</span></td>
                            <td style="width: 34%; text-align: center; padding: 4px;">
                                <div>ಪಾವತಿಸಿದ ರಶೀದಿ</div>
                                <div>ನೇರವಾಗಿ ರಾಜ್ಯಕ್ಕೆ ವರ್ಗಾವಣೆ</div>
                            </td>
                            <td style="width: 33%; text-align: right; padding: 4px;">ದಿನಾಂಕ : <span>${formattedDate}</span></td>
                        </tr>
                    </table>

                    <!-- Donor Info Grid -->
                    <table style="width: 100%; border-collapse: collapse; border-bottom: 1.5px solid #800000; font-size: 13px;">
                        <tr>
                            <td style="width: 35%; padding: 6px; vertical-align: top; border-right: 1px solid #800000;">
                                <strong>ಹೆಸರು:</strong> <span>${donorName}</span>
                            </td>
                            <td style="width: 33%; padding: 6px; vertical-align: top; border-right: 1px solid #800000;">
                                <div><strong>ಗ್ರಾಮ/ಪಟ್ಟಣ:</strong> <span>${village}</span></div>
                                <div style="margin-top: 4px;"><strong>ವಿಳಾಸ:</strong> <span>${address}</span></div>
                            </td>
                            <td style="width: 32%; padding: 6px; vertical-align: top;">
                                <div><strong>ಮೊಬೈಲ್:</strong> <span>${mobile}</span></div>
                                <div style="margin-top: 4px;"><strong>ತಾಲೂಕು:</strong> <span>${taluk}</span></div>
                                <div style="margin-top: 4px;"><strong>ಜಿಲ್ಲೆ:</strong> <span>${district}</span></div>
                            </td>
                        </tr>
                    </table>

                    <!-- Payment Details Grid -->
                    <table style="width: 100%; border-collapse: collapse; border-bottom: 1.5px solid #800000; font-size: 13px;">
                        <tr>
                            <td style="width: 35%; padding: 6px; vertical-align: middle;">
                                <strong>ಪಾವತಿ ರಕಮು ರೂ:</strong> <span style="font-size: 15px; font-weight: bold;">${amountVal}</span>
                            </td>
                            <td style="width: 33%; padding: 6px; vertical-align: middle; text-align: center;">
                                <strong>ಪಾವತಿ ಮೋಡ್:</strong> <span style="font-weight: bold;">${modeVal}</span>
                            </td>
                            <td style="width: 32%; padding: 6px; vertical-align: middle; text-align: right; color: #166534; font-weight: bold;">
                                ಅದಾಬ್ ಗಳುೊಂದಿಗೆ ಸ್ವೀಕರಿಸಿದೆ
                            </td>
                        </tr>
                        <tr>
                            <td style="padding: 6px; vertical-align: top;">
                                <div><strong>ರಶೀದಿ ದಿನಾಂಕ:</strong> <span>${formattedDate}</span></div>
                                <div style="margin-top: 6px;"><strong>ಯಾವ ಖಾತೆಗೆ:</strong> <span>${accountVal}</span></div>
                                <div style="margin-top: 6px;"><strong>ಯೋಜನೆ ಉದ್ದೇಶ:</strong> <span>${purposeVal}</span></div>
                            </td>
                            <td style="padding: 6px; text-align: center; vertical-align: center;">
                                <img src="images/seal.png" onerror="this.src='images/seal.jpg'" style="height: 70px; width: auto; display: inline-block;">
                            </td>
                            <td style="padding: 6px; text-align: center; vertical-align: bottom;">
                                <img src="images/sig.png" onerror="this.src='images/sig.jpg'" style="height: 45px; width: auto; display: inline-block;"><br>
                                <strong style="color: #4c1d95; font-size: 12px;">ಶಹಾಬುದ್ದೀನ್ ಸಾಬ್ ನೂರಬಾಷ</strong><br>
                                <span style="font-size: 11px; color: #4c1d95; font-weight: bold;">ರಾಜ್ಯ ಕೋಶಾಧಿಕಾರಿ</span><br>
                                <span style="font-size: 10px; color: #4c1d95;">ಕರ್ನಾಟಕ ರಾಜ್ಯ ನಡಾಫ್ ಪಿಂಜಾರ್ ಸಂಘ (ರಿ)</span>
                            </td>
                        </tr>
                    </table>

                    <!-- Footer Bar -->
                    <table style="width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 4px; font-weight: bold;">
                        <tr>
                            <td style="width: 60%; color: #166534;">
                                ರಶೀದಿಗಳ ಕ್ರಮ ಸಂಖ್ಯೆಗಳು : <span>${recId}</span>
                            </td>
                            <td style="width: 40%; text-align: right;">
                                ಅಧಿಕೃತ ಸಹಿ
                            </td>
                        </tr>
                    </table>
                </div>
            `;

            document.body.appendChild(container);

            const opt = {
                margin: 5,
                filename: `Receipt-${recId}.pdf`,
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2, useCORS: true, logging: false },
                jsPDF: { unit: 'mm', format: 'a5', orientation: 'landscape' }
            };

            function triggerDownload() {
                if (typeof html2pdf !== 'undefined') {
                    html2pdf().from(container).set(opt).save().then(() => {
                        if (container.parentNode) container.parentNode.removeChild(container);
                    }).catch(err => {
                        console.error('PDF Save Error:', err);
                        window.print();
                        if (container.parentNode) container.parentNode.removeChild(container);
                    });
                } else {
                    window.print();
                    if (container.parentNode) container.parentNode.removeChild(container);
                }
            }

            if (typeof html2pdf === 'undefined') {
                const script = document.createElement('script');
                script.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js';
                script.onload = triggerDownload;
                script.onerror = triggerDownload;
                document.head.appendChild(script);
            } else {
                triggerDownload();
            }
        }
    </script>
</body>
</html>
